<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Akshay Portfolio</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<header>

    <nav class="navbar">

        <div class="logo">AKSHAY</div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="skills.html">Skills</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>

        <div class="social-icons">
            <a href=https://www.linkedin.com/in/deshik-akshendra-kumar-palem-35951523b?utm_source=share_via&utm_content=profile&utm_medium=member_android><i class="fab fa-linkedin"></i></a>
            <a href=https://github.com/Deshik123-aki><i class="fab fa-github"></i></a>
        </div>

    </nav>

</header>

<section class="contact-section">

    <div class="contact-left">

        <h4>GET IN TOUCH</h4>

        <h1>Let's Work Together</h1>

        <p>
            Have a project, internship opportunity, or just want to say hello?
            Feel free to contact me.
        </p>

        <div class="contact-card">
            <i class="fas fa-envelope"></i>
            <div>
                <h3>Email</h3>
                <span>deshikakshendrakumarpalem@gmail.com</span>
            </div>
        </div>

        <div class="contact-card">
            <i class="fas fa-phone"></i>
            <div>
                <h3>Phone</h3>
                <span>+91 0000000000</span>
            </div>
        </div>

        <div class="contact-card">
            <i class="fas fa-location-dot"></i>
            <div>
                <h3>Location</h3>
                <span>Chennai, India</span>
            </div>
        </div>

    </div>

    <div class="contact-right">

        <form id="contact-form">

            <input
                type="text"
                name="name"
                placeholder="Your Name"
                required>

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required>

            <input
                type="text"
                name="subject"
                placeholder="Subject">

            <textarea
                name="message"
                rows="7"
                placeholder="Write your message..."
                required></textarea>

            <button type="submit">
                Send Message
            </button>

        </form>

        <p id="status"></p>

    </div>

</section>

<script>

const form = document.getElementById("contact-form");
const status = document.getElementById("status");

form.addEventListener("submit", async function(e){

    e.preventDefault();

    const data = new FormData(form);

    const response = await fetch("https://formspree.io/f/maqgljyd",{

        method:"POST",

        body:data,

        headers:{
            'Accept':'application/json'
        }

    });

    if(response.ok){

        status.innerHTML="✅ Message Sent Successfully!";
        status.style.color="#39d353";
        form.reset();

    }else{

        status.innerHTML="❌ Failed to send message.";
        status.style.color="red";

    }

});

</script>

</body>
</html>
